<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portals Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f0f11; --card: #1c1c1e; --text: #ffffff; --text-secondary: #8e8e93; --accent: #0a84ff; --border: #2c2c2e; --star: #facc15; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; overflow-x: hidden; font-size: 16px; }
        
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #333; overflow: hidden; border: 2px solid var(--border); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .balance-pill { background: var(--card); padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 700; border: 1px solid var(--border); }
        .balance-pill svg { width: 18px; height: 18px; }

        .categories { display: flex; padding: 0 20px; margin-bottom: 20px; }
        .cat-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .cat-icon { width: 60px; height: 60px; background: var(--card); border-radius: 16px; display: flex; justify-content: center; align-items: center; border: 1px solid var(--border); }
        .cat-icon svg { width: 28px; height: 28px; fill: var(--text); }
        .cat-item span { font-size: 0.85rem; font-weight: 600; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; }
        .card { background: var(--card); border-radius: 18px; padding: 12px; border: 1px solid var(--border); position: relative; cursor: pointer; }
        .card-image { width: 100%; aspect-ratio: 1; background: #2a2a2d; border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { font-size: 1rem; font-weight: 800; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-id { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px; }
        
        .card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .price-btn { flex: 1; background: var(--accent); color: white; padding: 10px; border-radius: 12px; font-size: 0.95rem; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .price-btn svg { width: 14px; height: 14px; fill: white; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 15, 17, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 0.8rem; font-weight: 600; width: 33%; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .nav-item svg { width: 26px; height: 26px; fill: currentColor; }

        .profile-header { display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--border); margin-bottom: 15px; overflow: hidden; }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
        .profile-username { color: var(--text-secondary); font-size: 1rem; margin-bottom: 25px; }
        
        .balances-row { display: flex; gap: 12px; width: 100%; max-width: 400px; margin-bottom: 25px; }
        .balance-card { flex: 1; background: var(--card); padding: 20px; border-radius: 18px; border: 1px solid var(--border); text-align: center; }
        .balance-card-title { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; }
        .balance-card-value { font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
        .overlay.active { display: flex; }
        .bottom-sheet { background: #1c1c1e; width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 20px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.2, 1); position: relative; }
        .overlay.active .bottom-sheet { transform: translateY(0); }
        .drag-handle { width: 40px; height: 5px; background: #444; border-radius: 3px; margin: 0 auto 20px auto; }

        .sheet-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; }
        .input-group { background: #121214; border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; padding: 0 15px; margin-bottom: 15px; height: 55px; }
        .input-group input { background: transparent; border: none; color: white; font-size: 1rem; outline: none; width: 100%; font-weight: 600; }
        .btn-full { width: 100%; background: var(--accent); color: white; padding: 18px; border-radius: 16px; font-size: 1.1rem; font-weight: 800; border: none; margin-top: 15px; cursor: pointer; }
        .btn-full.secondary { background: #2c2c2e; }
        
        .item-info-box { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; background: #121214; padding: 15px; border-radius: 16px; border: 1px solid var(--border); }
        .item-info-img { width: 60px; height: 60px; border-radius: 12px; background: #2a2a2d; object-fit: cover; }
        .item-info-text { flex: 1; }
        .item-info-text h4 { font-size: 1.1rem; font-weight: 800; margin-bottom: 2px; }
        .item-info-text p { font-size: 0.85rem; color: var(--text-secondary); }
        .item-info-price { text-align: right; }
        .item-info-price div:first-child { font-size: 1.1rem; font-weight: 800; }
    </style>
</head>
<body>

    <!-- ЭКРАН: МАРКЕТ -->
    <div id="screen-market" class="screen active">
        <div class="header">
            <div class="avatar"><img id="header-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=default"></div>
            <div class="balance-pill">
                <svg viewBox="0 0 24 24" fill="#3b82f6"><path d="M12 2L2 12l10 10 10-10L12 2zm0 3l7 7-7 7-7-7 7-7z"/></svg>
                <span id="header-balance">0.00 GRAM</span>
            </div>
        </div>
        <div class="grid" id="market-grid"><p style="text-align:center; width:100%;">Загрузка...</p></div>
    </div>

    <!-- ЭКРАН: ИНВЕНТАРЬ -->
    <div id="screen-inventory" class="screen">
        <div class="header"><h1 style="font-size: 1.5rem;">Мой Инвентарь</h1></div>
        <div class="grid" id="inventory-grid"><p style="text-align:center; width:100%;">Загрузка...</p></div>
    </div>

    <!-- ЭКРАН: ПРОФИЛЬ -->
    <div id="screen-profile" class="screen">
        <div class="profile-header">
            <div class="profile-avatar"><img id="profile-avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=default"></div>
            <div class="profile-name" id="profile-name">Загрузка...</div>
            <div class="profile-username" id="profile-username">@...</div>
            <div class="balances-row">
                <div class="balance-card">
                    <div class="balance-card-title">Баланс GRAM</div>
                    <div class="balance-card-value" id="profile-gram-balance" style="color: #3b82f6;">0.00</div>
                </div>
                <div class="balance-card">
                    <div class="balance-card-title">Кристаллы</div>
                    <div class="balance-card-value" id="profile-stars-balance" style="color: #facc15;">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-market" onclick="switchTab('market')">
            <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2z"/></svg>
            <span>Маркет</span>
        </div>
        <div class="nav-item" id="nav-inventory" onclick="switchTab('inventory')">
            <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1z"/></svg>
            <span>Инвентарь</span>
        </div>
        <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Профиль</span>
        </div>
    </div>

    <!-- МОДАЛКИ -->
    <div class="overlay" id="inv-action-modal" onclick="closeModal('inv-action-modal')">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="drag-handle"></div>
            <div class="sheet-title" id="inv-gift-name">Название</div>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">Что вы хотите сделать?</p>
            <button class="btn-full" onclick="openSellModalFromInv()">Выставить на продажу</button>
            <button class="btn-full secondary" onclick="withdrawGift()">Вывод</button>
        </div>
    </div>

    <div class="overlay" id="sell-modal" onclick="closeModal('sell-modal')">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="drag-handle"></div>
            <div class="sheet-title">Продажа</div>
            <p style="color: var(--text-secondary); margin-bottom: 15px;" id="sell-gift-name">Название</p>
            <div class="input-group"><input type="number" id="sell-price" placeholder="Цена в GRAM" value="10"></div>
            <button class="btn-full" onclick="confirmSell()">Выставить</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ptcofqwsvyytcnoerazu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_CL2wAd6YW9tj5fIq4r9b4A_iVeZtnBx";
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let currentUserId = null;
        let currentGramBalance = 0;
        let selectedInventoryId = null;
        let selectedInventoryName = '';

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            currentUserId = parseInt(urlParams.get('user_id')) || (tg.initDataUnsafe?.user?.id);
            if (!currentUserId) return;

            // Загружаем данные (включая аватарку)
            await loadBalances();
            loadMarket();
            loadInventory();
        }

        async function loadBalances() {
            try {
                let { data } = await db.from('users').select('*').eq('user_id', currentUserId).limit(1);
                
                if (!data || data.length === 0) {
                    const walletAddress = 'T' + Math.random().toString(36).substring(2, 15).toUpperCase();
                    await db.from('users').insert({ user_id: currentUserId, wallet_address: walletAddress });
                    data = [{ gram_balance: 0, balance: 0, username: '', first_name: 'Пользователь', avatar_url: '' }];
                }

                const u = data[0];
                
                // УСТАНОВКА АВАТАРКИ (Если есть в базе - ставим, если нет - генерим)
                const avatarUrl = u.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${currentUserId}`;
                document.getElementById('header-avatar').src = avatarUrl;
                document.getElementById('profile-avatar-img').src = avatarUrl;

                // ИМЯ И ЮЗЕР
                if (u.first_name) document.getElementById('profile-name').innerText = u.first_name;
                if (u.username) document.getElementById('profile-username').innerText = '@' + u.username;
                else document.getElementById('profile-username').innerText = 'ID: ' + currentUserId;

                // БАЛАНСЫ
                currentGramBalance = parseFloat(u.gram_balance) || 0;
                const crystals = parseInt(u.balance) || 0;

                document.getElementById('header-balance').innerText = currentGramBalance.toFixed(2) + ' GRAM';
                document.getElementById('profile-gram-balance').innerText = currentGramBalance.toFixed(2);
                document.getElementById('profile-stars-balance').innerText = crystals;

            } catch (e) { console.error(e); }
        }

        async function loadMarket() {
            const grid = document.getElementById('market-grid');
            const { data } = await db.from('market_items').select('*').eq('is_sold', false);
            if (!data || data.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%;">Пусто</p>';
                return;
            }
            grid.innerHTML = data.map(item => `
                <div class="card">
                    <div class="card-image"><img src="${item.image_url || 'https://placehold.co/200x200/2a2a2d/ffffff?text=Gift'}"></div>
                    <div class="card-title">${item.name}</div>
                    <div class="card-id">${item.price_gram} GRAM</div>
                    <div class="card-bottom">
                        <div class="price-btn" onclick="buyGift('${item.id}', ${item.price_gram}, ${item.seller_id})">Купить</div>
                    </div>
                </div>
            `).join('');
        }

        async function loadInventory() {
            const grid = document.getElementById('inventory-grid');
            const { data } = await db.from('inventory').select('*').eq('user_id', currentUserId).eq('status', 'inventory');
            if (!data || data.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%;">У вас нет подарков</p>';
                return;
            }
            grid.innerHTML = data.map(item => `
                <div class="card" onclick="openInventoryAction('${item.id}', '${item.gift_name}')">
                    <div class="card-image"><img src="https://placehold.co/200x200/2a2a2d/ffffff?text=Gift"></div>
                    <div class="card-title">${item.gift_name}</div>
                </div>
            `).join('');
        }

        function switchTab(tab) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('screen-' + tab).classList.add('active');
            document.getElementById('nav-' + tab).classList.add('active');
            if(tab === 'market') loadMarket();
            if(tab === 'inventory') loadInventory();
            if(tab === 'profile') loadBalances();
        }

        async function buyGift(giftId, price, sellerId) {
            if (price > currentGramBalance) return tg.showAlert("Недостаточно GRAM");
            
            const res = await fetch('https://misu-bot-5uwv.onrender.com/buy_gift', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUserId, gift_id: giftId, price_gram: price, seller_id: sellerId })
            });
            const result = await res.json();
            if (result.status === 'ok') {
                tg.showAlert("Успешно куплено!");
                init(); 
            } else {
                tg.showAlert("Ошибка: " + result.message);
            }
        }

        function openInventoryAction(id, name) {
            selectedInventoryId = id;
            selectedInventoryName = name;
            document.getElementById('inv-gift-name').innerText = name;
            document.getElementById('inv-action-modal').classList.add('active');
        }

        function openSellModalFromInv() {
            closeModal('inv-action-modal');
            document.getElementById('sell-gift-name').innerText = selectedInventoryName;
            document.getElementById('sell-modal').classList.add('active');
        }

        async function withdrawGift() {
            try {
                const res = await fetch('https://misu-bot-5uwv.onrender.com/notify_admin', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUserId, gift_name: selectedInventoryName })
                });
                
                if (res.ok) {
                    tg.showAlert("Заявка отправлена Админу!");
                    closeModal('inv-action-modal');
                } else {
                    tg.showAlert("Ошибка сервера.");
                }
            } catch(e) { tg.showAlert("Ошибка сети."); }
        }

        async function confirmSell() {
            const price = parseFloat(document.getElementById('sell-price').value);
            if (!price || price <= 0) return tg.showAlert("Введите цену");
            
            await db.from('market_items').insert({
                name: selectedInventoryName,
                price_gram: price,
                seller_id: currentUserId,
                is_sold: false
            });
            await db.from('inventory').delete().eq('id', selectedInventoryId);
            
            tg.showAlert("Выставлено на продажу!");
            closeModal('sell-modal');
            loadInventory();
            loadMarket();
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        init();
    </script>
</body>
                                         </html>
