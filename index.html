<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gift Boost</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- ХЕДЕР --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .users-pill {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #888;
            font-size: 14px;
            font-weight: 500;
        }

        .balance-pill {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            gap: 6px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
        }

        .balance-pill .star { color: #ffd700; }

        .btn-topup {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .profile-avatar {
            width: 32px; height: 32px; border-radius: 50%; background: #333;
            background-image: url('https://i.pravatar.cc/100'); background-size: cover;
        }

        /* --- БАННЕР --- */
        .banner {
            margin: 0 15px 15px;
            background: #111;
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            position: relative;
        }
        .banner-icon {
            width: 30px; height: 30px; background: #ff4500; border-radius: 8px; margin-right: 10px;
        }
        .banner-text { font-size: 13px; font-weight: 600; }
        .banner-close { position: absolute; right: 15px; color: #555; cursor: pointer; }

        /* --- КОЛЕСО --- */
        .wheel-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .wheel-labels-top {
            display: flex;
            justify-content: space-between;
            width: 250px;
            font-size: 11px;
            color: #444;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .wheel-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 15px solid #111;
            background: #050505;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        }

        .wheel-progress {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 15px solid transparent;
            border-bottom-color: #ff8c00;
            border-right-color: #ff8c00;
            transform: rotate(-45deg);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .wheel-progress.active { opacity: 1; }

        .percent-display {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .percent-num { font-size: 32px; font-weight: 700; letter-spacing: -1px; }
        .percent-lbl { font-size: 11px; color: #666; margin-top: 2px; }

        .arrow-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            transition: transform 3.5s cubic-bezier(0.1, 0.7, 0.1, 1);
        }
        .arrow-shape {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 24px;
            background: #ffd700;
            clip-path: polygon(50% 0%, 100% 40%, 70% 40%, 70% 100%, 30% 100%, 30% 40%, 0% 40%);
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.8));
        }

        .wheel-labels-bottom {
            display: flex;
            justify-content: center;
            width: 250px;
            font-size: 11px;
            color: #444;
            font-weight: 600;
            margin-top: 5px;
        }

        /* --- КАРТОЧКИ ПОДАРКОВ (ЦЕНТР) --- */
        .gift-cards {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            z-index: 10;
        }
        .gift-card {
            width: 140px;
            background: #151515;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .gift-card.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }
        .gift-price {
            position: absolute;
            top: 8px; right: 8px;
            background: #222; color: #fff;
            padding: 2px 6px; border-radius: 10px;
            font-size: 11px; font-weight: 600;
            display: flex; align-items: center; gap: 4px;
        }
        .gift-img {
            width: 60px; height: 60px; object-fit: contain; margin: 15px 0 10px;
        }
        .gift-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; text-align: center; }
        .gift-sub { font-size: 11px; color: #666; }

        /* --- КНОПКИ УПРАВЛЕНИЯ --- */
        .controls {
            padding: 15px;
            z-index: 10;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-icon {
            width: 45px; height: 45px;
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            color: #ffd700;
        }

        .btn-boost {
            flex-grow: 1;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-boost:active { transform: scale(0.98); }
        .btn-boost:disabled { background: #222; color: #555; }

        .chances-grid {
            display: flex;
            gap: 6px;
        }
        .chance-btn {
            flex: 1;
            background: #111;
            border: 1px solid #222;
            color: #666;
            padding: 10px 0;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chance-btn.active {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        /* --- НИЖНЯЯ ПАНЕЛЬ (ИНВЕНТАРЬ) --- */
        .inventory-section {
            padding: 0 15px 15px;
            z-index: 10;
        }

        .tabs {
            display: flex;
            background: #111;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 12px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #666;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab.active {
            background: #222;
            color: #fff;
        }

        .search-box {
            background: #111;
            border-radius: 12px;
            padding: 12px;
        }
        .search-title {
            font-size: 13px; color: #fff; font-weight: 600; margin-bottom: 10px;
            display: flex; align-items: center; gap: 5px;
        }
        .search-title .gift-icon { color: #ffd700; }
        
        .search-inputs {
            display: flex;
            gap: 8px;
        }
        .search-input {
            flex: 1;
            background: #050505;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .search-input::placeholder { color: #555; }
        
        .search-btn {
            width: 40px;
            background: #222;
            border: none;
            border-radius: 8px;
            color: #888;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }

        /* --- ПОДВАЛ (НАВИГАЦИЯ) --- */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #0a0a0a;
            padding: 15px 0;
            border-top: 1px solid #111;
            z-index: 10;
        }
        .nav-item {
            color: #444;
            cursor: pointer;
        }
        .nav-item.active { color: #ffd700; }
        .nav-icon { width: 24px; height: 24px; fill: currentColor; }

    </style>
</head>
<body>

    <!-- ХЕДЕР -->
    <div class="header">
        <div class="header-left">
            <div class="users-pill">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                100
            </div>
            <div class="balance-pill">
                <span class="star">⭐</span>

            </div>
            <button class="btn-topup">+ Пополнить</button>

    <!-- БАННЕР -->
    <div class="banner">
        <div class="banner-icon"></div>

    <!-- КОЛЕСО -->
    <div class="wheel-section">
        <div class="wheel-labels-top">
            <span>50%</span><span>100%</span><span>50%</span>
        </div>
        <div class="wheel-wrapper">
            <div class="wheel-bg"></div>
            <div class="wheel-progress" id="wheelProgress"></div>
            <div class="percent-display">
                <div class="percent-num" id="chanceDisplay">25.00%</div>

        <div class="wheel-labels-bottom">

    </div>

    <!-- КАРТОЧКИ ПОДАРКОВ -->
    <div class="gift-cards">
        <div class="gift-card" onclick="selectGift(this, 100)">
            <div class="gift-price">⭐ 100</div>

        </div>
        <div class="gift-card" onclick="selectGift(this, 3.19)">
            <div class="gift-price" style="background:#007bff;color:#fff;">🌍 3.19</div>
            <img src="https://cdn-icons-png.flaticon.com/512/4213/4213230.png" class="gift-img" alt="Подарок">
            <div class="gift-name">Xmas Stocking</div>
            <div class="gift-sub">#200912</div>
        </div>
    </div>

    <!-- УПРАВЛЕНИЕ -->
    <div class="controls">
        <div class="action-row">
            <div class="btn-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            </div>
            <button class="btn-boost" id="spinBtn" onclick="spin()">Забустить</button>
            <div class="btn-icon" onclick="openSettings()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
        </div>
        <div class="chances-grid">
            <div class="chance-btn" onclick="setChance(50, this)">x2</div>
            <div class="chance-btn active" onclick="setChance(25, this)">x4</div>
            <div class="chance-btn" onclick="setChance(1, this)">x100</div>
            <div class="chance-btn" onclick="setChance(35, this)">35%</div>
            <div class="chance-btn" onclick="setChance(55, this)">55%</div>
            <div class="chance-btn" onclick="setChance(75, this)">75%</div>
        </div>
    </div>

    <!-- ИНВЕНТАРЬ -->
    <div class="inventory-section">
        <div class="tabs">
            <div class="tab" onclick="switchTab(this, 'my-inv')">Мой инвентарь</div>
            <div class="tab active" onclick="switchTab(this, 'wish-inv')">Желаемые подарки</div>
        </div>

        <div class="search-box">
            <div class="search-title">
                <span class="gift-icon">🎁</span> Выберите подарок
            </div>
            <div class="search-inputs">
                <input type="text" class="search-input" placeholder="Цена От" id="searchMin">
                <input type="text" class="search-input" placeholder="Цена До" id="searchMax">
                <button class="search-btn" onclick="filterGifts()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>
        </div>
        <div class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 10h16v11H4zM4 4h16v6H4z"/></svg>
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
    </div>

    <!-- МОДАЛКА НАСТРОЕК -->
    <div class="modal" id="settingsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; justify-content:center; align-items:center;">
        <div style="background:#111; padding:20px; border-radius:12px; width:80%; text-align:center; border:1px solid #222;">
            <h3 style="margin-bottom:15px;">Свой шанс</h3>
            <input type="number" id="customChanceInput" style="width:100%; padding:10px; margin-bottom:15px; background:#050505; border:1px solid #333; color:#fff; text-align:center; border-radius:8px;">
            <button onclick="applyCustomChance()" style="width:100%; padding:12px; background:#ffd700; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Применить</button>
            <button onclick="closeSettings()" style="width:100%; padding:10px; background:transparent; border:none; color:#888; margin-top:10px; cursor:pointer;">Отмена</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.setHeaderColor('#000000'); }

        let balance = 1000;
        let chance = 25;
        let rotation = 0;
        let isSpinning = false;
        let betAmount = 100; // Ставка по умолчанию

        // Обновление интерфейса
        function updateUI() {
            document.getElementById('balanceDisplay').innerText = balance.toFixed(2);
            document.getElementById('chanceDisplay').innerText = chance.toFixed(2) + "%";
        }

        // Выбор шанса
        function setChance(val, el) {
            if (isSpinning) return;
            chance = val;
            document.querySelectorAll('.chance-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            updateUI();
        }

        // Выбор подарка (карточки в центре)
        function selectGift(el, price) {
            if (isSpinning) return;
            document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            betAmount = price;
            // Можно добавить логику обновления текста ставки
        }

        // Переключение вкладок
        function switchTab(el, type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            // Тут могла бы быть логика загрузки разных списков подарков
        }

        // Поиск/фильтрация
        function filterGifts() {
            let min = document.getElementById('searchMin').value;
            let max = document.getElementById('searchMax').value;
            if (tg) {
                tg.showAlert(`Поиск подарков: от ${min || 0} до ${max || '∞'}`);
            } else {
                alert(`Поиск подарков: от ${min || 0} до ${max || '∞'}`);
            }
            // Здесь будет код фильтрации карточек
        }

        // Настройки
        function openSettings() {
            if (isSpinning) return;
            document.getElementById('settingsModal').style.display = 'flex';
            document.getElementById('customChanceInput').value = chance;
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function applyCustomChance() {
            let val = parseFloat(document.getElementById('customChanceInput').value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 99) val = 99;
            chance = val;
            document.querySelectorAll('.chance-btn').forEach(b => b.classList.remove('active'));
            closeSettings();
            updateUI();
        }

        // Логика кручения
        function spin() {
            if (isSpinning) return;
            if (balance < betAmount) {
                if (tg) tg.showAlert("Недостаточно средств!");
                return;
            }

            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            const arrow = document.getElementById('arrowContainer');
            const progress = document.getElementById('wheelProgress');

            btn.innerText = "Крутим...";
            btn.disabled = true;
            progress.classList.add('active'); // Включаем оранжевую подсветку

            balance -= betAmount;
            updateUI();

            // Определяем выигрыш
            const winRoll = Math.random() * 100;
            const isWin = winRoll <= chance;

            // Логика поворота
            let targetDeg = isWin ? 0 : 180;
            targetDeg += (Math.random() * 40 - 20); // Разброс

            let currentMod = rotation % 360;
            let diff = targetDeg - currentMod;
            if (diff < 0) diff += 360;

            rotation += (5 * 360) + diff; // 5 полных оборотов
            arrow.style.transform = `rotate(${rotation}deg)`;

            setTimeout(() => {
                progress.classList.remove('active'); // Выключаем подсветку

                // Сброс угла
                arrow.style.transition = 'none';
                rotation = rotation % 360;
                arrow.style.transform = `rotate(${rotation}deg)`;
                
                setTimeout(() => {
                    arrow.style.transition = 'transform 3.5s cubic-bezier(0.1, 0.7, 0.1, 1)';
                }, 50);

                // Обработка результата
                if (isWin) {
                    let multiplier = 100 / chance;
                    let winAmount = Math.floor(betAmount * multiplier);
                    balance += winAmount;
                    if (tg) tg.showAlert(`🎉 ВЫИГРАЛ!\nШанс: ${chance}%\n+${winAmount} ⭐`);
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    if (tg) tg.showAlert(`💀 ПРОИГРАЛ!\nШанс: ${chance}%\n-${betAmount} ⭐`);
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }

                updateUI();
                isSpinning = false;
                btn.disabled = false;
                btn.innerText = "Забустить";
            }, 3600); // Ждем окончания анимации
        }

        // Инициализация
        updateUI();
    </script>
</body>
</html>
