<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gift Boost</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- ХЕДЕР --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            z-index: 10;
        }

        .balance-box {
            display: flex;
            align-items: center;
            background: transparent;
            border: 1px solid #ffd700;
            padding: 6px 14px;
            border-radius: 20px;
            gap: 6px;
        }

        /* 3D Иконка Звезды (SVG) */
        .icon-star {
            width: 18px;
            height: 18px;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
        }

        .balance-box span.amount {
            font-weight: 700;
            font-size: 14px;
            color: #ffd700;
        }

        .deposit-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        /* --- ЗОНА КОЛЕСА --- */
        .wheel-zone {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding-top: 20px;
        }

        .wheel-outer-rings {
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            border: 1px solid #151515;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        
        .wheel-outer-rings::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 1px solid #111;
        }

        .wheel-container {
            position: relative;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: #070707;
            border: 2px solid #151515;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8) inset;
        }

        .wheel-container.spinning {
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.15) inset;
        }

        .chance-display {
            text-align: center;
            z-index: 2;
        }

        .chance-number {
            font-size: 44px;
            font-weight: 500;
            margin: 0;
            color: #ffffff;
            letter-spacing: -1px;
        }

        .chance-label {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
            font-weight: 500;
        }

        /* --- СТРЕЛКА --- */
        .arrow-wrapper {
            position: absolute;
            width: 300px;
            height: 300px;
            pointer-events: none;
            z-index: 5;
            transition: transform 3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .arrow-svg {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 40px;
        }

        /* --- КНОПКИ ШАНСОВ --- */
        .chance-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            z-index: 10;
            padding: 0 15px;
        }

        .quick-bet-btn {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            text-align: center;
        }

        .quick-bet-btn.active {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        .settings-btn {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
        }
        .settings-btn:hover { transform: rotate(90deg); color: #fff; }

        /* --- НИЖНЯЯ ПАНЕЛЬ --- */
        .bottom-panel {
            padding: 20px;
            background: #050505;
            z-index: 10;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            color: #555;
            font-weight: 600;
            align-items: center;
        }

        .slider-value-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .slider-value {
            color: #ffd700;
            font-weight: 700;
            font-size: 16px;
        }

        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
            margin-bottom: 20px;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffd700;
            cursor: pointer;
            margin-top: -6px;
        }

        /* Кнопка с иконкой */
        .action-btn {
            width: 100%;
            background: #ffd700;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn:disabled {
            background: #222;
            color: #555;
        }

        /* Иконка кубка в кнопке */
        .icon-cup {
            width: 20px;
            height: 20px;
        }

        /* --- МОДАЛКА --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #0a0a0a;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #222;
            text-align: center;
            width: 85%;
            max-width: 320px;
        }

        .modal-content h3 { margin: 0 0 15px 0; color: #fff; font-weight: 600; }
        
        .modal-content input {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
        }

        .modal-content button {
            width: 100%;
            padding: 12px;
            background: #ffd700;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            color: #000;
        }

        .modal-content button.cancel {
            background: #222;
            color: #fff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Хедер -->
    <div class="header">
        <div class="balance-box">
            <!-- Красивая 3D SVG звезда -->
            <svg class="icon-star" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="url(#gold-grad)" stroke="#b8860b" stroke-width="1"/>
                <defs>
                    <linearGradient id="gold-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#FFF7A1"/>
                        <stop offset="0.5" stop-color="#FFD700"/>
                        <stop offset="1" stop-color="#FFA500"/>
                    </linearGradient>
                </defs>
            </svg>
            <span class="amount" id="balance">1000</span>
        </div>
        <button class="deposit-btn" onclick="tg.showAlert('Пополнение в разработке')">+ ПОПОЛНИТЬ</button>
    </div>

    <!-- Зона игры -->
    <div class="wheel-zone">
        <div class="wheel-outer-rings"></div>
        
        <div class="wheel-container" id="wheel">
            <div class="chance-display">
                <h1 class="chance-number" id="chanceDisplay">50.00%</h1>
                <div class="chance-label">ШАНС ВЫИГРЫША</div>
            </div>
        </div>

        <div class="arrow-wrapper" id="arrowWrapper">
            <svg class="arrow-svg" viewBox="0 0 20 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 0L20 15H14V38H6V15H0L10 0Z" fill="#ffd700"/>
                <circle cx="10" cy="38" r="2" fill="#ffd700"/>
            </svg>
        </div>
    </div>

    <!-- Быстрые кнопки -->
    <div class="chance-controls">
        <button class="quick-bet-btn active" onclick="setChance(50)">x2 (50%)</button>
        <button class="quick-bet-btn" onclick="setChance(25)">x4 (25%)</button>
        <button class="quick-bet-btn" onclick="setChance(10)">x10 (10%)</button>
        
        <!-- Шестеренка -->
        <button class="settings-btn" onclick="openSettings()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </div>

    <!-- Нижняя панель -->
    <div class="bottom-panel">
        <div class="slider-header">
            <span>Ставка</span>
            <div class="slider-value-wrap">
                <!-- Иконка звезды рядом с цифрой ставки -->
                <svg class="icon-star" style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="url(#gold-grad)" stroke="#b8860b" stroke-width="1"/>
                </svg>
                <span class="slider-value" id="betValue">100</span>
            </div>
        </div>
        <input type="range" min="10" max="1000" value="100" id="betSlider" oninput="updateBet(this.value)">
        
        <button class="action-btn" id="spinBtn" onclick="spin()">
            <!-- Красивый 3D кубок (SVG) -->
            <svg class="icon-cup" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 4H18V9C18 12.3137 15.3137 15 12 15C8.68629 15 6 12.3137 6 9V4Z" fill="url(#gold-grad-btn)" stroke="#b8860b" stroke-width="1.5"/>
                <path d="M6 6H4C2.89543 6 2 6.89543 2 8V9C2 10.6569 3.34315 12 5 12H6" stroke="#b8860b" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M18 6H20C21.1046 6 22 6.89543 22 8V9C22 10.6569 20.6569 12 19 12H18" stroke="#b8860b" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M12 15V18" stroke="#b8860b" stroke-width="2"/>
                <path d="M8 21H16" stroke="#b8860b" stroke-width="2" stroke-linecap="round"/>
                <defs>
                    <linearGradient id="gold-grad-btn" x1="6" y1="4" x2="18" y2="15" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#FFF7A1"/>
                        <stop offset="0.5" stop-color="#FFD700"/>
                        <stop offset="1" stop-color="#FFA500"/>
                    </linearGradient>
                </defs>
            </svg>
            Крутить
        </button>
    </div>

    <!-- Модалка -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Кастомный шанс</h3>
            <input type="number" id="customChanceInput" placeholder="1-99" min="1" max="99">
            <button onclick="applyCustomChance()">Применить</button>
            <button class="cancel" onclick="closeSettings()">Отмена</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#000000');

        let currentBalance = 1000;
        let currentBet = 100;
        let currentChance = 50;
        let isSpinning = false;
        let currentRotation = 0;

        function updateUI() {
            document.getElementById('balance').innerText = currentBalance;
            document.getElementById('betValue').innerText = currentBet;
            document.getElementById('chanceDisplay').innerText = currentChance.toFixed(2) + "%";
        }

        function updateBet(value) {
            currentBet = parseInt(value);
            if (currentBet > currentBalance) currentBet = currentBalance;
            updateUI();
        }

        function setChance(chance) {
            if (isSpinning) return;
            currentChance = chance;
            document.querySelectorAll('.quick-bet-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.quick-bet-btn').forEach(btn => {
                if (btn.innerText.includes(chance + '%')) btn.classList.add('active');
            });
            updateUI();
        }

        function openSettings() {
            if (isSpinning) return;
            document.getElementById('settingsModal').style.display = 'flex';
            document.getElementById('customChanceInput').value = currentChance;
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function applyCustomChance() {
            let val = parseFloat(document.getElementById('customChanceInput').value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 99) val = 99;
            currentChance = val;
            document.querySelectorAll('.quick-bet-btn').forEach(btn => btn.classList.remove('active'));
            closeSettings();
            updateUI();
        }

        function spin() {
            if (isSpinning) return;
            if (currentBet <= 0) return tg.showAlert("Введите ставку!");
            if (currentBet > currentBalance) return tg.showAlert("Недостаточно средств!");

            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            const arrowWrapper = document.getElementById('arrowWrapper');
            const wheel = document.getElementById('wheel');
            
            btn.disabled = true;
            btn.innerHTML = "Крутим...";
            wheel.classList.add('spinning');

            currentBalance -= currentBet;
            updateUI();

            const winRoll = Math.random() * 100;
            const isWin = winRoll <= currentChance;

            let targetDegrees = isWin ? 180 : 0;
            targetDegrees += (Math.random() * 60 - 30);

            const extraSpins = 5 * 360;
            
            let currentMod = currentRotation % 360;
            let diff = targetDegrees - currentMod;
            if (diff < 0) diff += 360; 

            currentRotation += extraSpins + diff;

            arrowWrapper.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                wheel.classList.remove('spinning');
                arrowWrapper.style.transition = 'none';
                currentRotation = currentRotation % 360;
                arrowWrapper.style.transform = `rotate(${currentRotation}deg)`;

                setTimeout(() => {
                    arrowWrapper.style.transition = 'transform 3s cubic-bezier(0.2, 0.8, 0.2, 1)';
                }, 50);

                if (isWin) {
                    let multiplier = 100 / currentChance;
                    let winAmount = Math.floor(currentBet * multiplier);
                    currentBalance += winAmount;
                    tg.showAlert(`🎉 ВЫИГРАЛ!\nШанс: ${currentChance}%\n+${winAmount} ⭐`);
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    tg.showAlert(`💀 ПРОИГРАЛ!\nШанс: ${currentChance}%\n-${currentBet} ⭐`);
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }

                updateUI();
                isSpinning = false;
                btn.disabled = false;
                // Возвращаем иконку кубка и текст
                btn.innerHTML = `<svg class="icon-cup" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 4H18V9C18 12.3137 15.3137 15 12 15C8.68629 15 6 12.3137 6 9V4Z" fill="url(#gold-grad-btn)" stroke="#b8860b" stroke-width="1.5"/><path d="M6 6H4C2.89543 6 2 6.89543 2 8V9C2 10.6569 3.34315 12 5 12H6" stroke="#b8860b" stroke-width="1.5" stroke-linecap="round"/><path d="M18 6H20C21.1046 6 22 6.89543 22 8V9C22 10.6569 20.6569 12 19 12H18" stroke="#b8860b" stroke-width="1.5" stroke-linecap="round"/><path d="M12 15V18" stroke="#b8860b" stroke-width="2"/><path d="M8 21H16" stroke="#b8860b" stroke-width="2" stroke-linecap="round"/><defs><linearGradient id="gold-grad-btn" x1="6" y1="4" x2="18" y2="15" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF7A1"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#FFA500"/></linearGradient></defs></svg> Крутить`;

                if (currentBalance <= 0) {
                    btn.disabled = true;
                    btn.innerText = "БАНКРОТ";
                }

            }, 3100);
        }

        updateUI();
    </script>
</body>
</html>
