<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portals Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0f0f11; 
            --card: #1c1c1e; 
            --text: #ffffff; 
            --text-secondary: #8e8e93; 
            --accent: #3b82f6; 
            --border: #2c2c2e;
            --green: #4ade80;
            --purple: #a855f7;
            --yellow: #facc15;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 80px; overflow-x: hidden; }
        
        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #333; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px solid var(--border); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .header-balances { display: flex; gap: 8px; }
        .balance-pill { background: var(--card); padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border); }
        .balance-pill svg { width: 16px; height: 16px; }

        /* BANNER */
        .banner { margin: 0 20px 20px 20px; background: linear-gradient(135deg, #2a1b38 0%, #1a1a1a 100%); border-radius: 20px; padding: 20px; position: relative; overflow: hidden; border: 1px solid var(--border); }
        .banner h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 5px; line-height: 1.1; }
        .banner p { color: #ffb703; font-size: 1rem; font-weight: 600; margin-bottom: 15px; }
        .banner-timer { display: inline-block; background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; backdrop-filter: blur(5px); }
        .banner-img { position: absolute; right: -10px; bottom: -10px; width: 120px; height: 120px; opacity: 0.8; background: url('https://i.imgur.com/8Y2yXyO.png') no-repeat center/contain; /* Placeholder */ }

        /* CATEGORIES */
        .categories { display: flex; justify-content: space-between; padding: 0 20px; margin-bottom: 20px; }
        .cat-item { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 22%; cursor: pointer; }
        .cat-icon { width: 60px; height: 60px; background: var(--card); border-radius: 16px; display: flex; justify-content: center; align-items: center; border: 1px solid var(--border); transition: 0.2s; }
        .cat-icon svg { width: 28px; height: 28px; fill: var(--text-secondary); }
        .cat-item.active .cat-icon { background: #222; border-color: #444; }
        .cat-item.active .cat-icon svg { fill: var(--text); }
        .cat-item span { font-size: 0.75rem; font-weight: 500; color: var(--text-secondary); }
        .cat-item.active span { color: var(--text); font-weight: 600; }

        /* SEARCH */
        .search-row { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 15px; }
        .search-input-wrapper { flex: 1; background: var(--card); border-radius: 16px; display: flex; align-items: center; padding: 0 15px; border: 1px solid var(--border); }
        .search-input-wrapper svg { width: 20px; height: 20px; fill: var(--text-secondary); margin-right: 10px; }
        .search-input-wrapper input { background: transparent; border: none; color: var(--text); width: 100%; padding: 15px 0; font-size: 0.9rem; outline: none; }
        .search-input-wrapper input::placeholder { color: var(--text-secondary); }
        .icon-btn { width: 50px; height: 50px; background: var(--card); border-radius: 16px; display: flex; justify-content: center; align-items: center; border: 1px solid var(--border); cursor: pointer; }
        .icon-btn svg { width: 20px; height: 20px; fill: var(--text); }

        /* FILTERS */
        .filters-row { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 20px; overflow-x: auto; }
        .filter-pill { background: var(--card); padding: 10px 16px; border-radius: 16px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); white-space: nowrap; cursor: pointer; }
        .filter-pill svg { width: 14px; height: 14px; fill: var(--text); }

        /* GRID */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; }
        .card { background: var(--card); border-radius: 20px; padding: 12px; border: 1px solid var(--border); position: relative; cursor: pointer; }
        .card-tags { position: absolute; top: 12px; left: 12px; display: flex; gap: 5px; z-index: 2; }
        .tag { width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .tag svg { width: 14px; height: 14px; fill: white; }
        .tag.green { background: #22c55e; }
        .tag.purple { background: #a855f7; }
        .tag.blue { background: #3b82f6; }
        
        .card-image { width: 100%; aspect-ratio: 1; background: #2a2a2d; border-radius: 15px; margin-bottom: 12px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .card-image img { width: 80%; height: 80%; object-fit: contain; }

        .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-id { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 12px; }
        
        .card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .price-btn { flex: 1; background: #3b82f6; color: white; padding: 10px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .price-btn svg { width: 14px; height: 14px; fill: white; }
        .buy-btn { width: 40px; height: 40px; background: #2c2c2e; border-radius: 12px; display: flex; justify-content: center; align-items: center; }
        .buy-btn svg { width: 18px; height: 18px; fill: var(--text); }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 15, 17, 0.9); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--border); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 0.75rem; font-weight: 500; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
        .nav-avatar { width: 28px; height: 28px; border-radius: 50%; background: #333; border: 2px solid var(--border); overflow: hidden; }
        .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>

          <script>
        // === ПОДКЛЮЧЕНИЕ К SUPABASE И TELEGRAM ===
        const SUPABASE_URL = "https://ptcofqwsvyytcnoerazu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_CL2wAd6YW9tj5fIq4r9b4A_iVeZtnBx";
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const paramId = urlParams.get('user_id');
        const userId = paramId ? parseInt(paramId) : 0;

        // === ЗАГРУЗКА ДАННЫХ ПОЛЬЗОВАТЕЛЯ ===
        async function loadUserData() {
            if (!userId) return;

            try {
                // Запрашиваем баланс из базы (таблица users)
                const { data, error } = await db.from('users').select('balance, gram_balance').eq('user_id', userId).maybeSingle();
                
                if (data && !error) {
                    // Обновляем баланс Звезд (первая плашка)
                    const starsBalanceEl = document.querySelector('.balance-pill:nth-child(1)');
                    if (starsBalanceEl) {
                        // data.balance - это поле для звезд в твоей базе
                        const stars = parseInt(data.balance) || 0;
                        starsBalanceEl.innerHTML = `
                            <svg viewBox="0 0 24 24" fill="#facc15"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                            ${stars >= 1000 ? (stars/1000).toFixed(1) + 'K' : stars}
                        `;
                    }

                    // Обновляем баланс GRAM (вторая плашка)
                    const gramBalanceEl = document.querySelector('.balance-pill:nth-child(2)');
                    if (gramBalanceEl) {
                        const gram = parseFloat(data.gram_balance) || 0;
                        gramBalanceEl.innerHTML = `
                            <svg viewBox="0 0 24 24" fill="#3b82f6"><path d="M12 2L2 12l10 10 10-10L12 2zm0 3l7 7-7 7-7-7 7-7z"/></svg>
                            ${gram.toFixed(2)} GRAM
                        `;
                    }
                }
            } catch (e) {
                console.error("Ошибка загрузки профиля:", e);
            }
        }

        // === УСТАНОВКА АВАТАРКИ ИЗ TELEGRAM ===
        function setTelegramAvatar() {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.photo_url) {
                const photoUrl = tg.initDataUnsafe.user.photo_url;
                
                // Меняем аватарку в шапке
                const headerAvatar = document.querySelector('.avatar img');
                if (headerAvatar) headerAvatar.src = photoUrl;

                // Меняем аватарку в нижнем меню (Профиль)
                const navAvatar = document.querySelector('.nav-avatar img');
                if (navAvatar) navAvatar.src = photoUrl;
            }
        }

        // === ЛОГИКА ИНТЕРФЕЙСА (КЛИКИ) ===
        
        // Переключение нижнего меню (Маркет / Ивент / Профиль)
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                // Убираем класс active у всех
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                // Добавляем класс active тому, на который нажали
                this.classList.add('active');
                
                // Здесь в будущем будет переключение экранов (Маркет, Ивент, Профиль)
                // tg.HapticFeedback.impactOccurred('light'); // Вибрация (если поддерживается)
            });
        });

        // Переключение категорий (Все, Коллекции, Звезды, Крафт)
        document.querySelectorAll('.cat-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.cat-item').forEach(cat => cat.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // === СТАРТ ===
        setTelegramAvatar();
        loadUserData();
    </script>
