<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gift Boost</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* --- ХЕДЕР --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-count {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #aaa;
            font-size: 14px;
        }

        .balance-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            gap: 6px;
        }
        
        .balance-box .star-icon {
            width: 16px;
            height: 16px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffd700"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>') no-repeat center;
            background-size: contain;
        }

        .balance-box span.amount {
            font-weight: 600;
            font-size: 14px;
            color: #fff;
        }

        .deposit-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-right: 10px;
        }

        .profile-pic {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #333;
            background-image: url('https://i.pravatar.cc/100'); /* Заглушка */
            background-size: cover;
        }

        /* --- БАННЕР --- */
        .banner {
            margin: 0 15px 15px 15px;
            background: linear-gradient(90deg, #2a1a0a, #1a1a1a);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            position: relative;
        }
        .banner-img {
            width: 40px; height: 40px; border-radius: 8px; background: #ff4500; margin-right: 10px;
        }
        .banner-text { font-size: 12px; font-weight: 600; flex-grow: 1; }
        .banner-close { position: absolute; right: 10px; top: 10px; color: #888; font-size: 12px; }

        /* --- ЗОНА КОЛЕСА --- */
        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-top: 10px;
        }

        .wheel-labels {
            display: flex;
            justify-content: space-between;
            width: 280px;
            font-size: 12px;
            color: #555;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .wheel-container {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Кольца */
        .ring-outer {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 15px solid #151515;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .ring-inner {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 10px solid #111;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            z-index: 2;
        }

        /* Прогресс (оранжевая заливка) */
        .progress-ring {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 15px solid transparent;
            border-bottom-color: #ff8c00;
            border-right-color: #ff8c00;
            transform: rotate(-45deg);
            z-index: 1;
            opacity: 0; /* Скрыто по умолчанию */
            transition: opacity 0.3s;
        }
        .progress-ring.active { opacity: 1; }

        .chance-display {
            text-align: center;
            z-index: 5;
        }

        .chance-number {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            color: #fff;
        }

        .chance-label {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }

        /* Стрелка */
        .arrow-wrapper {
            position: absolute;
            width: 240px;
            height: 240px;
            pointer-events: none;
            z-index: 6;
            transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1); /* Плавная остановка */
        }

        .arrow-svg {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 24px;
        }

        /* --- КАРТОЧКИ ПОДАРКОВ --- */
        .gift-cards {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 0 15px;
            margin-top: -10px; /* Наложение на колесо */
            z-index: 10;
            position: relative;
        }

        .gift-card {
            flex: 1;
            background: #151515;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .gift-card.purple { background: linear-gradient(180deg, #2a1a3a, #151515); border-color: #4a2a6a; }

        .gift-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 5px;
        }

        .gift-price-tag {
            position: absolute;
            top: -10px;
            right: -5px;
            background: #ffd700;
            color: #000;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .gift-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
            text-align: center;
        }
        .gift-subtitle {
            font-size: 11px;
            color: #777;
            margin-top: 2px;
        }

        /* --- КНОПКИ ШАНСОВ --- */
        .controls-area {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .boost-row {
            display: flex;
            gap: 10px;
        }

        .btn-lightning {
            width: 45px;
            height: 45px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffd700;
            font-size: 20px;
        }

        .btn-boost {
            flex-grow: 1;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-settings {
            width: 45px;
            height: 45px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #888;
        }

        .chances-row {
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }

        .chance-btn {
            flex: 1;
            background: #151515;
            border: 1px solid #333;
            color: #888;
            padding: 10px 0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            transition: 0.2s;
        }

        .chance-btn.active {
            border-color: #ffd700;
            color: #ffd700;
        }

        /* --- ИНВЕНТАРЬ --- */
        .inventory-tabs {
            display: flex;
            background: #151515;
            border-radius: 12px;
            padding: 4px;
            margin: 0 15px;
        }

        .inv-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #777;
            border-radius: 8px;
        }

        .inv-tab.active {
            background: #222;
            color: #fff;
        }

        .search-area {
            margin: 15px;
            background: #151515;
            border-radius: 12px;
            padding: 12px;
        }

        .search-title {
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .search-row {
            display: flex;
            gap: 5px;
        }

        .search-input {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 8px 10px;
            color: #fff;
            font-size: 13px;
        }

        .search-btn {
            background: #222;
            border: none;
            border-radius: 8px;
            width: 35px;
            color: #888;
        }

        /* --- ПОДВАЛ --- */
        .footer-nav {
            display: flex;
            justify-content: space-around;
            background: #0a0a0a;
            padding: 10px 0;
            margin-top: auto;
            border-top: 1px solid #151515;
        }

        .nav-item {
            color: #444;
            font-size: 24px;
        }
        .nav-item.active { color: #ffd700; }

    </style>
</head>
<body>

    <!-- ХЕДЕР -->
    <div class="header">
        <div class="header-left">
            <div class="user-count">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                100
            </div>
            <div class="balance-box">
                <div class="star-icon"></div>
                <span class="amount" id="balance">0.00</span>
            </div>
            <button class="deposit-btn">+ Пополнить</button>
        </div>
        <div class="profile-pic"></div>
    </div>

    <!-- БАННЕР -->
    <div class="banner">
        <div class="banner-img"></div>
        <div class="banner-text">Бесплатный NFT Кейс</div>
        <div class="banner-close">✕</div>
    </div>

    <!-- КОЛЕСО -->
    <div class="wheel-section">
        <div class="wheel-labels">
            <span>50%</span>
            <span>100%</span>
            <span>50%</span>
        </div>
        <div class="wheel-container" id="wheel">
            <div class="ring-outer"></div>
            <div class="progress-ring" id="progressRing"></div>
            <div class="ring-inner">
                <div class="chance-display">
                    <h1 class="chance-number" id="chanceDisplay">0.00%</h1>
                    <div class="chance-label">Средний шанс</div>
                </div>
            </div>
            <div class="arrow-wrapper" id="arrowWrapper">
                <svg class="arrow-svg" viewBox="0 0 20 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 0L20 12H13V24H7V12H0L10 0Z" fill="#ffd700"/>
                </svg>
            </div>
        </div>
        <div class="wheel-labels" style="margin-top: 5px;">
            <span>0%</span>
        </div>
    </div>

    <!-- КАРТОЧКИ ПОДАРКОВ -->
    <div class="gift-cards">
        <div class="gift-card">
            <div class="gift-price-tag">⭐ 100</div>
            <!-- Заглушка для Кубка (тестовый подарок 1) -->
            <img src="https://cdn-icons-png.flaticon.com/512/3113/3113549.png" class="gift-img" alt="Кубок">
            <div class="gift-title">Кубок</div>
            <div class="gift-subtitle">Обычный</div>
        </div>
        <div class="gift-card purple">
            <div class="gift-price-tag" style="background:#007bff;color:white;">🌍 3.19</div>
            <!-- Заглушка для Подарка (тестовый подарок 2) -->
            <img src="https://cdn-icons-png.flaticon.com/512/4213/4213230.png" class="gift-img" alt="Подарок">
            <div class="gift-title">Xmas Stocking</div>
            <div class="gift-subtitle">#200912</div>
        </div>
    </div>

    <!-- КНОПКИ УПРАВЛЕНИЯ -->
    <div class="controls-area">
        <div class="boost-row">
            <div class="btn-lightning">⚡</div>
            <button class="btn-boost" id="spinBtn" onclick="spin()">Забустить</button>
            <div class="btn-settings" onclick="openSettings()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
        </div>

        <div class="chances-row">
            <div class="chance-btn" onclick="setChance(50, this)">x2</div>
            <div class="chance-btn active" onclick="setChance(25, this)">x4</div>
            <div class="chance-btn" onclick="setChance(1, this)">x100</div>
            <div class="chance-btn" onclick="setChance(35, this)">35%</div>
            <div class="chance-btn" onclick="setChance(55, this)">55%</div>
            <div class="chance-btn" onclick="setChance(75, this)">75%</div>
        </div>
    </div>

    <!-- ИНВЕНТАРЬ -->
    <div class="inventory-tabs">
        <div class="inv-tab">Мой инвентарь</div>
        <div class="inv-tab active">Желаемые подарки</div>
    </div>

    <div class="search-area">
        <div class="search-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            Выберите подарок
        </div>
        <div class="search-row">
            <input type="text" class="search-input" placeholder="Цена От / До">
            <button class="search-btn">🔍</button>
        </div>
    </div>

    <!-- ПОДВАЛ -->
    <div class="footer-nav">
        <div class="nav-item">🎁</div>
        <div class="nav-item">🏆</div>
        <div class="nav-item active">▲</div>
        <div class="nav-item">👤</div>
        <div class="nav-item">🎵</div>
    </div>

    <!-- МОДАЛКА НАСТРОЕК -->
    <div class="modal" id="settingsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; justify-content:center; align-items:center;">
        <div style="background:#111; padding:20px; border-radius:12px; width:80%; text-align:center;">
            <h3>Свой шанс</h3>
            <input type="number" id="customChanceInput" style="width:100%; padding:10px; margin:10px 0; background:#000; border:1px solid #333; color:#fff; text-align:center;">
            <button onclick="applyCustomChance()" style="width:100%; padding:10px; background:#ffd700; border:none; border-radius:8px; font-weight:bold;">ОК</button>
            <button onclick="document.getElementById('settingsModal').style.display='none'" style="width:100%; padding:10px; background:transparent; border:none; color:#888; margin-top:10px;">Отмена</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#050505');

        let currentBalance = 1000;
        let currentChance = 25; // По умолчанию х4
        let isSpinning = false;
        let currentRotation = 0;

        // Обновление текста шанса
        function updateUI() {
            document.getElementById('balance').innerText = currentBalance;
            document.getElementById('chanceDisplay').innerText = currentChance.toFixed(2) + "%";
        }

        // Выбор шанса
        function setChance(chance, element) {
            if (isSpinning) return;
            currentChance = chance;
            // Убираем активный класс со всех кнопок
            document.querySelectorAll('.chance-btn').forEach(btn => btn.classList.remove('active'));
            // Добавляем текущей
            element.classList.add('active');
            updateUI();
        }

        // Настройки
        function openSettings() {
            if (isSpinning) return;
            document.getElementById('settingsModal').style.display = 'flex';
            document.getElementById('customChanceInput').value = currentChance;
        }

        function applyCustomChance() {
            let val = parseFloat(document.getElementById('customChanceInput').value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 99) val = 99;
            currentChance = val;
            document.querySelectorAll('.chance-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('settingsModal').style.display = 'none';
            updateUI();
        }

        // Логика кручения
        function spin() {
            if (isSpinning) return;
            
            // Ставка фиксированная (в оригинале она берется из выбранного подарка или слайдера, 
            // здесь для теста ставим фикс 100)
            const betAmount = 100; 
            if (currentBalance < betAmount) return tg.showAlert("Недостаточно средств!");

            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            const arrowWrapper = document.getElementById('arrowWrapper');
            const progressRing = document.getElementById('progressRing');
            
            btn.innerText = "Крутим...";
            progressRing.classList.add('active'); // Включаем оранжевую подсветку

            currentBalance -= betAmount;
            updateUI();

            // Определяем выигрыш
            const winRoll = Math.random() * 100;
            const isWin = winRoll <= currentChance;

            // Логика вращения
            // 0 градусов - стрелка смотрит вниз.
            // Если выиграл - оставляем внизу (0), если проиграл - уводим вверх (180).
            let targetDegrees = isWin ? 0 : 180; 
            targetDegrees += (Math.random() * 30 - 15); // Небольшой разброс

            const extraSpins = 5 * 360; // 5 оборотов
            let currentMod = currentRotation % 360;
            let diff = targetDegrees - currentMod;
            if (diff < 0) diff += 360; 

            currentRotation += extraSpins + diff;
            arrowWrapper.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                progressRing.classList.remove('active'); // Выключаем подсветку
                
                // Сброс угла для следующего вращения
                arrowWrapper.style.transition = 'none';
                currentRotation = currentRotation % 360;
                arrowWrapper.style.transform = `rotate(${currentRotation}deg)`;
                setTimeout(() => {
                    arrowWrapper.style.transition = 'transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)';
                }, 50);

                // Результат
                if (isWin) {
                    let multiplier = 100 / currentChance;
                    let winAmount = Math.floor(betAmount * multiplier);
                    currentBalance += winAmount;
                    tg.showAlert(`🎉 ВЫИГРАЛ!\nШанс: ${currentChance}%\n+${winAmount} ⭐`);
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    tg.showAlert(`💀 ПРОИГРАЛ!\nШанс: ${currentChance}%\n-${betAmount} ⭐`);
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }

                updateUI();
                isSpinning = false;
                btn.innerText = "Забустить";

            }, 4100); // Ждем 4.1 сек (чуть больше анимации)
        }

        updateUI();
    </script>
</body>
</html>
