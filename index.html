<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roulette Mini App</title>
    <style>
        /* Базовые стили (Темная тема как на скрине) */
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { margin: 0; padding: 0; background-color: #0d0e12; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Хедер (Баланс и кнопка) */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: #0d0e12; }
        .balance-box { display: flex; align-items: center; background-color: #1c1d24; padding: 8px 15px; border-radius: 20px; gap: 8px; }
        .balance-box span { font-weight: bold; font-size: 16px; }
        .deposit-btn { background-color: #ffd700; color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; }
        
        /* Колесо */
        .wheel-container { position: relative; flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .wheel { position: relative; width: 280px; height: 280px; border-radius: 50%; border: 20px solid #1c1d24; display: flex; justify-content: center; align-items: center; background-color: #12131a; }
        
        /* Процент в центре */
        .chance-text { text-align: center; }
        .chance-number { font-size: 42px; font-weight: bold; margin: 0; }
        .chance-label { font-size: 14px; color: #888; margin-top: 5px; }

        /* Стрелочка */
        .arrow { position: absolute; bottom: -30px; color: #ffd700; font-size: 30px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Слоты для выбора */
        .slots-container { display: flex; justify-content: space-between; padding: 0 20px; gap: 15px; }
        .slot { flex: 1; background-color: #1c1d24; border: 2px solid transparent; border-radius: 15px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .slot:hover { border-color: #ffd700; }
        .slot-title { color: #ffd700; font-weight: bold; font-size: 14px; margin-bottom: 10px; display: block; }
        .slot-text { font-size: 12px; color: #aaa; }
        .slot.active { border-color: #ffd700; background-color: #2a2b36; }

        /* Слайдер */
        .slider-container { padding: 20px; margin-top: auto; }
        .slider-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #aaa; }
        .slider-value { color: #fff; font-weight: bold; font-size: 18px; }
        input[type=range] { width: 100%; -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #1c1d24; border-radius: 5px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #ffd700; cursor: pointer; margin-top: -7px; box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }

        /* Кнопка действия */
        .action-btn { width: 100%; background-color: #ffd700; color: #000; border: none; padding: 18px; border-radius: 15px; font-weight: bold; font-size: 18px; margin-top: 20px; cursor: pointer; text-transform: uppercase; }
        .action-btn:disabled { background-color: #555; color: #888; }
    </style>
</head>
<body>

    <!-- Хедер -->
    <div class="header">
        <div class="balance-box">
            <span style="color: #ffd700;">⭐</span>
            <span id="balance">0.00</span>
        </div>
        <button class="deposit-btn">+ ПОПОЛНИТЬ</button>
    </div>

    <!-- Колесо -->
    <div class="wheel-container">
        <div class="wheel">
            <div class="chance-text">
                <h1 class="chance-number" id="chanceDisplay">0.00%</h1>
                <div class="chance-label">Средний шанс</div>
            </div>
        </div>
        <div class="arrow">▲</div>
    </div>

    <!-- Слоты -->
    <div class="slots-container">
        <div class="slot active" onclick="selectSlot(this)">
            <span class="slot-title">+ Добавить</span>
            <div class="slot-text">Выберите подарок или поставьте GRAM</div>
        </div>
        <div class="slot" onclick="selectSlot(this)">
            <span class="slot-title">+ Выбрать</span>
            <div class="slot-text">Выберите подарок для буста</div>
        </div>
    </div>

    <!-- Слайдер и Кнопка -->
    <div class="slider-container">
        <div class="slider-header">
            <span>Ставка</span>
            <span class="slider-value" id="betValue">0.00</span>
        </div>
        <input type="range" min="0" max="100" value="0" id="betSlider" oninput="updateBet(this.value)">
        <button class="action-btn" id="spinBtn" onclick="spin()">Крутить</button>
    </div>

    <script>
        // Логика для мини-приложения
        let currentBalance = 0; // Тут будет баланс пользователя
        let currentBet = 0;
        let maxBet = 100; // Максимальная ставка

        function updateBet(value) {
            currentBet = value;
            document.getElementById('betValue').innerText = currentBet + ".00";
            
            // Логика шанса: чем больше ставка, тем меньше шанс (как в оригинале)
            // Например: ставка 1 = шанс 90%, ставка 100 = шанс 1%
            let chance = 100 - currentBet;
            if (chance < 1) chance = 1;
            document.getElementById('chanceDisplay').innerText = chance.toFixed(2) + "%";
        }

        function selectSlot(element) {
            // Убираем класс active у всех слотов
            document.querySelectorAll('.slot').forEach(el => el.classList.remove('active'));
            // Добавляем класс active выбранному
            element.classList.add('active');
        }

        function spin() {
            if (currentBet <= 0) return alert("Выберите ставку!");
            
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.innerText = "Крутим...";

            // Имитация отправки на сервер и задержки
            setTimeout(() => {
                const win = Math.random() > 0.5; // 50/50 для теста
                if (win) {
                    alert("Вы выиграли!");
                    // Тут будет логика начисления денег
                } else {
                    alert("Вы проиграли!");
                    // Тут будет логика списания денег
                }
                btn.disabled = false;
                btn.innerText = "Крутить";
            }, 1500);
        }
    </script>
</body>
</html>
