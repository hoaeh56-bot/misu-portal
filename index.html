<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gift Boost</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050508 80%);
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Хедер */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            z-index: 10;
        }

        .balance-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            gap: 8px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
        }

        .balance-box span {
            font-weight: 800;
            font-size: 16px;
            color: #ffd700;
        }

        .deposit-btn {
            background: linear-gradient(90deg, #ffd700, #ffaa00);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            transition: transform 0.1s;
        }
        .deposit-btn:active { transform: scale(0.95); }

        /* Зона колеса */
        .wheel-zone {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        /* Колесо */
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: #0f1016;
            border: 4px solid #1c1d24;
            box-shadow: 
                0 0 40px rgba(0, 0, 0, 0.8) inset,
                0 0 20px rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease-out;
        }

        /* Свечение вокруг колеса при вращении */
        .wheel-container.spinning {
            box-shadow: 
                0 0 40px rgba(0, 0, 0, 0.8) inset,
                0 0 30px rgba(255, 215, 0, 0.3);
        }

        /* Внутренний круг с процентами */
        .chance-display {
            text-align: center;
            z-index: 2;
        }

        .chance-number {
            font-size: 48px;
            font-weight: 800;
            margin: 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            transition: color 0.3s;
        }

        .chance-label {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Стрелка (указатель) */
        .arrow-pointer {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid #ffd700;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
            z-index: 5;
            transition: transform 3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Силуэт пэпэ (заглушка) */
        .pepe-silhouette {
            position: absolute;
            bottom: -30px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0,255,0,0.1) 0%, transparent 70%);
            z-index: 0;
            opacity: 0.5;
            filter: blur(10px);
        }

        /* Шестеренка и шансы */
        .chance-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            z-index: 10;
        }

        .quick-bet-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #aaa;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .quick-bet-btn:hover, .quick-bet-btn.active {
            background: rgba(255, 215, 0, 0.1);
            border-color: #ffd700;
            color: #ffd700;
        }

        .settings-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
            margin-left: 5px;
            transition: transform 0.3s;
        }
        .settings-btn:hover { transform: rotate(90deg); color: #fff; }

        /* Нижняя панель (Слайдер и кнопка) */
        .bottom-panel {
            padding: 20px;
            background: #0f1016;
            border-top: 1px solid #1c1d24;
            z-index: 10;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #888;
            font-weight: 600;
        }

        .slider-value {
            color: #ffd700;
            font-weight: 800;
            font-size: 18px;
        }

        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
            margin-bottom: 20px;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            background: #1c1d24;
            border-radius: 10px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffd700;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            border: 2px solid #fff;
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(90deg, #ffd700, #ffaa00);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .action-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
        }

        .action-btn:disabled {
            background: #1c1d24;
            color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Модалка для кастомных шансов */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1c1d24;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #333;
            text-align: center;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .modal-content h3 { margin-top: 0; color: #ffd700; }
        
        .modal-content input {
            width: 100%;
            padding: 10px;
            background: #0f1016;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            margin: 15px 0;
            text-align: center;
        }

        .modal-content button {
            width: 100%;
            padding: 12px;
            background: #ffd700;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        /* Анимация кручения */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Хедер -->
    <div class="header">
        <div class="balance-box">
            <span>⭐</span>
            <span id="balance">1000</span> <!-- Стартовый баланс -->
        </div>
        <button class="deposit-btn" onclick="tg.showAlert('Пополнение в разработке')">+ ПОПОЛНИТЬ</button>
    </div>

    <!-- Зона игры -->
    <div class="wheel-zone">
        <div class="pepe-silhouette"></div> <!-- Силуэт на фоне -->
        
        <div class="wheel-container" id="wheel">
            <div class="chance-display">
                <h1 class="chance-number" id="chanceDisplay">50.00%</h1>
                <div class="chance-label">Шанс выигрыша</div>
            </div>
        </div>
        <!-- Стрелка, которая крутится -->
        <div class="arrow-pointer" id="arrow"></div>
    </div>

    <!-- Быстрые кнопки шансов -->
    <div class="chance-controls">
        <button class="quick-bet-btn active" onclick="setChance(50)">x2 (50%)</button>
        <button class="quick-bet-btn" onclick="setChance(25)">x4 (25%)</button>
        <button class="quick-bet-btn" onclick="setChance(10)">x10 (10%)</button>
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
    </div>

    <!-- Нижняя панель -->
    <div class="bottom-panel">
        <div class="slider-header">
            <span>Ставка</span>
            <span class="slider-value" id="betValue">100</span>
        </div>
        <!-- Слайдер для ставки -->
        <input type="range" min="10" max="1000" value="100" id="betSlider" oninput="updateBet(this.value)">
        
        <!-- Кнопка действия -->
        <button class="action-btn" id="spinBtn" onclick="spin()">
            <span>🎰</span> Крутить
        </button>
    </div>

    <!-- Модалка настроек -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Кастомный шанс</h3>
            <p style="color: #888; font-size: 12px;">Введите желаемый шанс (1-99%)</p>
            <input type="number" id="customChanceInput" placeholder="Например: 75" min="1" max="99">
            <button onclick="applyCustomChance()">Применить</button>
            <button style="background: transparent; color: #888; margin-top: 10px;" onclick="closeSettings()">Отмена</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран
        tg.setHeaderColor('#050508'); // Цвет хедера

        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        let currentBalance = 1000;
        let currentBet = 100;
        let currentChance = 50;
        let isSpinning = false;

        // Обновление баланса на экране
        function updateUI() {
            document.getElementById('balance').innerText = currentBalance;
            document.getElementById('betValue').innerText = currentBet;
            document.getElementById('chanceDisplay').innerText = currentChance.toFixed(2) + "%";
        }

        // Изменение ставки слайдером
        function updateBet(value) {
            currentBet = parseInt(value);
            if (currentBet > currentBalance) currentBet = currentBalance;
            updateUI();
        }

        // Установка шанса через быстрые кнопки
        function setChance(chance) {
            if (isSpinning) return;
            currentChance = chance;
            // Убираем активный класс у всех
            document.querySelectorAll('.quick-bet-btn').forEach(btn => btn.classList.remove('active'));
            // Добавляем активный текущей кнопке (ищем по тексту)
            document.querySelectorAll('.quick-bet-btn').forEach(btn => {
                if (btn.innerText.includes(chance + '%')) btn.classList.add('active');
            });
            updateUI();
        }

        // --- НАСТРОЙКИ (Шестеренка) ---
        function openSettings() {
            if (isSpinning) return;
            document.getElementById('settingsModal').style.display = 'flex';
            document.getElementById('customChanceInput').value = currentChance;
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function applyCustomChance() {
            let val = parseFloat(document.getElementById('customChanceInput').value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 99) val = 99;
            currentChance = val;
            document.querySelectorAll('.quick-bet-btn').forEach(btn => btn.classList.remove('active'));
            closeSettings();
            updateUI();
        }

        // --- ЛОГИКА ВРАЩЕНИЯ ---
        let currentRotation = 0; // Текущий угол стрелки

        function spin() {
            if (isSpinning) return;
            if (currentBet <= 0) return tg.showAlert("Введите ставку!");
            if (currentBet > currentBalance) return tg.showAlert("Недостаточно средств!");

            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            const arrow = document.getElementById('arrow');
            const wheel = document.getElementById('wheel');
            
            // Блокируем кнопку
            btn.disabled = true;
            btn.innerHTML = "<span>⏳</span> Крутим...";
            wheel.classList.add('spinning');

            // 1. Списываем ставку
            currentBalance -= currentBet;
            updateUI();

            // 2. Определяем результат (Math.random)
            const winRoll = Math.random() * 100; // 0 - 100
            const isWin = winRoll <= currentChance;

            // 3. Вычисляем угол для анимации
            // Стрелка указывает вниз (0 градусов). 
            // Нам нужно, чтобы она остановилась на секторе выигрыша или проигрыша.
            // Для простоты сделаем так: если выиграл - стрелка едет к 0 (или 360), если проиграл - к 180.
            
            let targetDegrees = isWin ? 0 : 180;
            
            // Добавляем случайное смещение, чтобы не всегда в одну точку
            targetDegrees += (Math.random() * 40 - 20); 

            // Чтобы было красиво, добавляем несколько полных оборотов
            // Быстрая прокрутка: 2 полных оборота (720 град)
            // Плавная: 5 полных оборотов (1800 град)
            const extraSpins = 3 * 360; 
            
            // Итоговый угол = текущий + обороты + смещение к цели
            // Находим разницу между текущим углом и целевым
            let currentMod = currentRotation % 360;
            let diff = targetDegrees - currentMod;
            if (diff < 0) diff += 360; // Кратчайший путь

            currentRotation += extraSpins + diff;

            // Применяем CSS transition и крутим
            arrow.style.transform = `translateX(-50%) rotate(${currentRotation}deg)`;

            // 4. Ждем окончания анимации (3 секунды)
            setTimeout(() => {
                wheel.classList.remove('spinning');
                arrow.style.transition = 'none'; // Убираем плавность на мгновение
                
                // Обнуляем визуальный угол (чтобы не накапливался бесконечно)
                currentRotation = currentRotation % 360;
                arrow.style.transform = `translateX(-50%) rotate(${currentRotation}deg)`;

                // Возвращаем плавность через секунду
                setTimeout(() => {
                    arrow.style.transition = 'transform 3s cubic-bezier(0.2, 0.8, 0.2, 1)';
                }, 50);

                // 5. Обрабатываем результат
                if (isWin) {
                    // Выигрыш: возвращаем ставку + выигрыш
                    // Коэффициент = 100 / chance. 
                    // Если шанс 50%, коэф 2. Выигрыш = ставка * 2 (возврат + профит)
                    let multiplier = 100 / currentChance;
                    let winAmount = Math.floor(currentBet * multiplier);
                    
                    currentBalance += winAmount;
                    tg.showAlert(`🎉 ВЫИГРАЛ!\nВаш шанс: ${currentChance}%\nВыигрыш: +${winAmount} ⭐`);
                    
                    // Вибро-отклик (если поддерживается)
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    tg.showAlert(`💀 ПРОИГРАЛ!\nВаш шанс: ${currentChance}%\nПотеряно: -${currentBet} ⭐`);
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }

                updateUI();
                
                // Разблокируем кнопку
                isSpinning = false;
                btn.disabled = false;
                btn.innerHTML = "<span>🎰</span> Крутить";

                // Если баланс кончился, не даем играть
                if (currentBalance <= 0) {
                    btn.disabled = true;
                    btn.innerText = "БАНКРОТ";
                }

            }, 3100); // Ждем 3.1 сек (чуть больше времени анимации)
        }

        // Первичная инициализация
        updateUI();
    </script>
</body>
</html>
