<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portals Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f0f11; --card: #1c1c1e; --text: #ffffff; --text-secondary: #8e8e93; --accent: #3b82f6; --border: #2c2c2e; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; overflow-x: hidden; }
        .screen { display: none; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #333; overflow: hidden; border: 1px solid var(--border); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .balance-pill { background: var(--card); padding: 8px 14px; border-radius: 20px; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border); }
        .balance-pill svg { width: 16px; height: 16px; }

        /* CATEGORIES */
        .categories { display: flex; padding: 0 20px; margin-bottom: 20px; }
        .cat-item { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .cat-icon { width: 60px; height: 60px; background: var(--card); border-radius: 16px; display: flex; justify-content: center; align-items: center; border: 1px solid var(--border); }
        .cat-icon svg { width: 28px; height: 28px; fill: var(--text); }
        .cat-item span { font-size: 0.75rem; font-weight: 600; }

        /* SEARCH & FILTERS */
        .search-row { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 15px; }
        .search-wrapper { flex: 1; background: var(--card); border-radius: 16px; display: flex; align-items: center; padding: 0 15px; border: 1px solid var(--border); }
        .search-wrapper svg { width: 20px; height: 20px; fill: var(--text-secondary); margin-right: 10px; }
        .search-wrapper input { background: transparent; border: none; color: var(--text); width: 100%; padding: 15px 0; font-size: 0.9rem; outline: none; }
        .icon-btn { width: 50px; height: 50px; background: var(--card); border-radius: 16px; display: flex; justify-content: center; align-items: center; border: 1px solid var(--border); }
        .icon-btn svg { width: 20px; height: 20px; fill: var(--text); }
        .filters-row { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 20px; overflow-x: auto; }
        .filter-pill { background: var(--card); padding: 10px 16px; border-radius: 16px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); white-space: nowrap; }

        /* GRID & CARDS */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; }
        .card { background: var(--card); border-radius: 20px; padding: 12px; border: 1px solid var(--border); position: relative; }
        .card-tags { position: absolute; top: 12px; left: 12px; display: flex; gap: 5px; z-index: 2; }
        .tag { width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .tag svg { width: 14px; height: 14px; fill: white; }
        .tag.green { background: #22c55e; }
        .tag.purple { background: #a855f7; }
        .card-image { width: 100%; aspect-ratio: 1; background: #2a2a2d; border-radius: 15px; margin-bottom: 12px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-id { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 12px; }
        .card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .price-btn { flex: 1; background: #3b82f6; color: white; padding: 10px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .price-btn svg { width: 14px; height: 14px; fill: white; }
        .buy-btn { width: 40px; height: 40px; background: #2c2c2e; border-radius: 12px; display: flex; justify-content: center; align-items: center; }
        .buy-btn svg { width: 18px; height: 18px; fill: var(--text); }

        /* PROFILE */
        .profile-header { display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--border); margin-bottom: 15px; overflow: hidden; }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name { font-size: 1.5rem; font-weight: 800; margin-bottom: 5px; }
        .profile-username { color: var(--text-secondary); font-size: 1rem; margin-bottom: 20px; }
        .profile-balance-card { background: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%); border-radius: 20px; padding: 20px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 400px; margin-bottom: 30px; }
        .balance-title { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 5px; }
        .balance-value { font-size: 1.5rem; font-weight: 700; }
        .balance-icon { width: 50px; height: 50px; background: rgba(59, 130, 246, 0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        
        .inventory-header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; margin-bottom: 15px; }
        .inventory-header h3 { font-size: 1.2rem; font-weight: 700; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 15, 17, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--border); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 0.75rem; font-weight: 600; cursor: pointer; width: 50%; }
        .nav-item.active { color: var(--accent); }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: МАРКЕТ -->
    <div id="screen-market" class="screen active">
        <div class="header">
            <div class="avatar"><img src="https://i.pravatar.cc/100?img=11" alt="User"></div>
            <div class="balance-pill">
                <svg viewBox="0 0 24 24" fill="#3b82f6"><path d="M12 2L2 12l10 10 10-10L12 2zm0 3l7 7-7 7-7-7 7-7z"/></svg>
                <span id="header-gram-balance">0.00 GRAM</span>
            </div>
        </div>

        <div class="categories">
            <div class="cat-item active">
                <div class="cat-icon"><svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg></div>
                <span>Все</span>
            </div>
        </div>

        <div class="search-row">
            <div class="search-wrapper">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" placeholder="Быстрый поиск">
            </div>
            <div class="icon-btn"><svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg></div>
        </div>

        <div class="filters-row">
            <div class="filter-pill"><svg viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>Фильтр</div>
            <div class="filter-pill"><svg viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/></svg>Сортировка</div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="card-tags">
                    <div class="tag green"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></div>
                    <div class="tag purple"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg></div>
                </div>
                <div class="card-image"><img src="https://placehold.co/200x200/2a2a2d/ffffff?text=Gift" alt="Jolly Chimp"></div>
                <div class="card-title">Jolly Chimp</div>
                <div class="card-id">#95059</div>
                <div class="card-bottom">
                    <div class="price-btn">16.99 <svg viewBox="0 0 24 24"><path d="M12 2L2 12l10 10 10-10L12 2z"/></svg></div>
                    <div class="buy-btn"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
                </div>
            </div>
            <div class="card">
                <div class="card-tags">
                    <div class="tag green"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></div>
                    <div class="tag blue"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg></div>
                </div>
                <div class="card-image"><img src="https://placehold.co/200x200/2a2a2d/ffffff?text=Gift" alt="Clover Pin"></div>
                <div class="card-title">Clover Pin</div>
                <div class="card-id">#6259</div>
                <div class="card-bottom">
                    <div class="price-btn">7 <svg viewBox="0 0 24 24"><path d="M12 2L2 12l10 10 10-10L12 2z"/></svg></div>
                    <div class="buy-btn"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: ПРОФИЛЬ + ИНВЕНТАРЬ -->
    <div id="screen-profile" class="screen">
        <div class="profile-header">
            <div class="profile-avatar">
                <img id="profile-avatar-img" src="https://i.pravatar.cc/100?img=11" alt="Avatar">
            </div>
            <div class="profile-name" id="profile-name">Пользователь</div>
            <div class="profile-username" id="profile-username">@username</div>

            <div class="profile-balance-card">
                <div>
                    <div class="balance-title">Ваш баланс</div>
                    <div class="balance-value" id="profile-gram-balance">0.00 GRAM</div>
                </div>
                <div class="balance-icon">
                    <svg viewBox="0 0 24 24" fill="#3b82f6" style="width: 24px; height: 24px;"><path d="M12 2L2 12l10 10 10-10L12 2zm0 3l7 7-7 7-7-7 7-7z"/></svg>
                </div>
            </div>
        </div>

        <!-- ИНВЕНТАРЬ -->
        <div class="inventory-header">
            <h3>Инвентарь</h3>
            <span style="color: var(--text-secondary); font-size: 0.8rem;">0 предметов</span>
        </div>
        
        <div class="grid" id="inventory-grid">
            <!-- Сюда будут падать купленные подарки -->
            <div style="grid-column: span 2; text-align: center; padding: 40px 20px; background: var(--card); border-radius: 20px; border: 1px dashed var(--border);">
                <svg viewBox="0 0 24 24" fill="var(--text-secondary)" style="width: 40px; height: 40px; margin-bottom: 10px;"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">У вас пока нет подарков</p>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-market" onclick="switchTab('market', this)">
            <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
            <span>Маркет</span>
        </div>
        <div class="nav-item" id="nav-profile" onclick="switchTab('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Профиль</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Переключение экранов
        function switchTab(tabId, element) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('screen-' + tabId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        // Установка данных из Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            
            if (user.photo_url) {
                document.getElementById('profile-avatar-img').src = user.photo_url;
                document.querySelector('.avatar img').src = user.photo_url;
            }
            
            document.getElementById('profile-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('profile-username').innerText = user.username ? '@' + user.username : '';
        }
    </script>
</body>
</html>
